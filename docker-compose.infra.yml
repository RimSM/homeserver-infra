# 홈서버 공용 인프라 — Postgres(pgvector) + Ollama + cloudflared(공개 터널)
#
# 실행 방법
#   stage (맥북, 개발):  docker compose -f docker-compose.infra.yml up -d postgres
#                        └ Ollama는 맥북 native 설치본(localhost:11434) 사용 (Metal 이점)
#                        └ cloudflared는 prod 전용(터널 자격증명이 맥미니에만 있음) → 아래 --profile prod
#   prod  (맥미니, 상시): docker compose -f docker-compose.infra.yml --profile prod up -d
#
# 사전: docker network create home-server-network  (없으면)
# 사전: cp .env.example .env  후 비밀번호 채우기
# 사전(cloudflared, prod만): cloudflared-n8n/, cloudflared-rag/ 각 config.yml에 자기 터널·자격증명 지정,
#   ~/.cloudflared에 두 터널의 자격증명 JSON 모두 존재해야 함

name: infra

services:
  postgres:
    image: pgvector/pgvector:pg17   # 표준 postgres 17 + pgvector 확장 포함 (Airflow 3.3.0 지원 범위 내)
    container_name: infra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # 앱별 role 비번 (initdb/01-init.sh가 읽어 role 생성)
      VAULT_RAG_DB_PASSWORD: ${VAULT_RAG_DB_PASSWORD:?VAULT_RAG_DB_PASSWORD를 .env에 설정하세요}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD를 .env에 설정하세요}
    ports:
      - "5432:5432"          # stage: 맥북 파이썬이 여기로 붙음
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro   # 최초 1회 자동 실행 (DB/role/확장 초기화)
    networks:
      - home-server-network
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # macOS Docker는 Metal(GPU) 접근 불가 → 이 컨테이너 Ollama는 CPU 전용.
  #    임베딩(bge-m3, 568M/1024d, 한국어 대응)엔 CPU 충분 → stage/prod 둘 다 컨테이너로 통일(옵션1).
  #    로컬 LLM 생성(7B+)을 하게 되면 그때 native Ollama(Metal)로 전환 고려.
  #    최초 1회: docker exec infra-ollama ollama pull bge-m3
  ollama:
    image: ollama/ollama:latest
    container_name: infra-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - home-server-network
    # bge-m3(~1.2GB) 로드 + 전체 재인덱싱 배치 피크용. 2g는 재인덱싱 시 99.6%로 무여유(실측)라 OOM 위험 →
    # 2560m(2.5GiB)로 실측 피크(~2.0GB) 위 ~0.5GB 헤드룸 확보. 평상시(질의)는 ~1.3GB만 사용.
    mem_limit: 2560m

  # 공개 터널(계층② Cloudflare Tunnel) — 원래 여러 서비스가 터널 하나를 공유했으나(2026-07-20
  # infra로 이전 직후), Cloudflare 터널에 CLI rename이 없고 대시보드 이름 변경은 비가역
  # "마이그레이션"을 거쳐야 해서 라벨(대시보드에 "n8n"으로만 표시)이 혼란스러움 + n8n은
  # 동료도 쓰는 서비스라 신뢰 경계도 다름 → **서비스별로 터널을 완전히 분리**(같은 날 재결정).
  # → vault 01_Projects/99_RIMSM/099.home-server/overview.md 결정 히스토리 2026-07-20.
  #
  # 둘 다 prod 전용(profiles: prod) — stage 맥북엔 터널 자격증명이 없어서 그냥 up -d 하면 실패함.
  cloudflared-n8n:
    image: cloudflare/cloudflared:latest      # TODO: 버전 핀 고정 (n8n 때부터 미룬 것)
    container_name: cloudflared-n8n
    restart: unless-stopped
    profiles: ["prod"]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared-n8n/config.yml:/etc/cloudflared/config.yml:ro
      - ~/.cloudflared:/etc/cloudflared/creds:ro   # 터널 자격증명들(호스트에만 존재, repo에 없음). 컨테이너는 자기 config.yml이 가리키는 파일만 씀
    # 터널은 프록시라 리소스를 거의 안 씀. 실측 유휴: 약 34MB / CPU 0.7% (2026-07-17)
    mem_limit: 256m
    cpus: 0.5
    networks:
      - home-server-network

  cloudflared-rag:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-rag
    restart: unless-stopped
    profiles: ["prod"]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared-rag/config.yml:/etc/cloudflared/config.yml:ro
      - ~/.cloudflared:/etc/cloudflared/creds:ro
    mem_limit: 256m
    cpus: 0.5
    networks:
      - home-server-network

  # --- 모니터링 (2026-07-26 신설: Grafana로 인프라 전체 리소스 가시화) ---
  # 컨테이너별 CPU/RAM/네트워크는 cadvisor가 이 호스트의 모든 컨테이너를 자동 수집.
  # postgres/ollama/cloudflared 쪽엔 별도 설정 불필요.
  prometheus:
    image: prom/prometheus:latest
    container_name: infra-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - home-server-network
    mem_limit: 256m

  grafana:
    image: grafana/grafana:latest
    container_name: infra-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD를 .env에 설정하세요}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - home-server-network
    mem_limit: 256m

  # macOS Docker는 VM 위에서 돌아서 이 exporter가 보는 CPU/RAM은 실제 맥 하드웨어 전체가
  # 아니라 그 VM 내부 수치임(다른 서비스들과 동일한 제약). 컨테이너별 비교는 cadvisor가 더 정확.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: infra-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks:
      - home-server-network
    mem_limit: 128m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: infra-cadvisor
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - home-server-network
    mem_limit: 128m

  # 공개 노출은 grafana만. prometheus/node-exporter/cadvisor는 home-server-network
  # 내부 전용(호스트 포트 미개방)이라 터널이 따로 필요 없음.
  cloudflared-grafana:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-grafana
    restart: unless-stopped
    profiles: ["prod"]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared-grafana/config.yml:/etc/cloudflared/config.yml:ro
      - ~/.cloudflared:/etc/cloudflared/creds:ro
    mem_limit: 256m
    cpus: 0.5
    networks:
      - home-server-network

volumes:
  pgdata:
  ollama:
  prometheus-data:
  grafana-data:

networks:
  home-server-network:
    external: true   # docker network create home-server-network 로 미리 생성
