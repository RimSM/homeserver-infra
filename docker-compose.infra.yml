# 홈서버 공용 인프라 — Postgres(pgvector) + Ollama + cloudflared(공개 터널)
#
# 실행 방법
#   stage (맥북, 개발):  docker compose -f docker-compose.infra.yml up -d postgres
#                        └ Ollama는 맥북 native 설치본(localhost:11434) 사용 (Metal 이점)
#                        └ cloudflared는 prod 전용(터널 자격증명이 맥미니에만 있음) → 아래 --profile prod
#   prod  (맥미니, 상시): docker compose -f docker-compose.infra.yml --profile prod up -d
#
# 사전: docker network create home-server-network  (없으면)
# 사전: cp .env.example .env  후 비밀번호 채우기
# 사전(cloudflared, prod만): cloudflared-n8n/, cloudflared-rag/ 각 config.yml에 자기 터널·자격증명 지정,
#   ~/.cloudflared에 두 터널의 자격증명 JSON 모두 존재해야 함

name: infra

services:
  postgres:
    image: pgvector/pgvector:pg17   # 표준 postgres 17 + pgvector 확장 포함 (Airflow 3.3.0 지원 범위 내)
    container_name: infra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # 앱별 role 비번 (initdb/01-init.sh가 읽어 role 생성)
      VAULT_RAG_DB_PASSWORD: ${VAULT_RAG_DB_PASSWORD:?VAULT_RAG_DB_PASSWORD를 .env에 설정하세요}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD를 .env에 설정하세요}
    ports:
      - "5432:5432"          # stage: 맥북 파이썬이 여기로 붙음
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro   # 최초 1회 자동 실행 (DB/role/확장 초기화)
    networks:
      - home-server-network
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # macOS Docker는 Metal(GPU) 접근 불가 → 이 컨테이너 Ollama는 CPU 전용.
  #    임베딩(bge-m3, 568M/1024d, 한국어 대응)엔 CPU 충분 → stage/prod 둘 다 컨테이너로 통일(옵션1).
  #    로컬 LLM 생성(7B+)을 하게 되면 그때 native Ollama(Metal)로 전환 고려.
  #    최초 1회: docker exec infra-ollama ollama pull bge-m3
  ollama:
    image: ollama/ollama:latest
    container_name: infra-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - home-server-network
    # bge-m3(~1.2GB) 로드 + 전체 재인덱싱 배치 피크용. 2g는 재인덱싱 시 99.6%로 무여유(실측)라 OOM 위험 →
    # 2560m(2.5GiB)로 실측 피크(~2.0GB) 위 ~0.5GB 헤드룸 확보. 평상시(질의)는 ~1.3GB만 사용.
    mem_limit: 2560m

  # --- 오브젝트 스토리지 (2026-07-28 신설: S3 대용, 프로젝트별 버킷) ---
  # S3 API 호환이라 boto3/aws-cli 등 기존 S3 코드가 endpoint_url만 바꾸면 그대로 붙음(검증 완료).
  # 프로젝트별로 버킷 + 전용 액세스키를 발급해 서로 못 보게 격리하는 게 운용 전제.
  #
  # ⚠️ 버킷·유저·정책 생성은 반드시 `mc` CLI로. MinIO 커뮤니티(AGPL) 빌드는 웹 콘솔에서
  #    관리 기능을 걷어냈음 — /api/v1/{users,policies,service-accounts}가 403이 아니라 **404**
  #    (바이너리에 경로 자체가 없음), /api/v1/admin/info는 501. 콘솔에 남은 건 로그인 +
  #    버킷/객체 브라우저뿐(2026-07-28 RELEASE.2025-09-07 실측).
  #
  # 최초 1회 프로비저닝 예시(컨테이너 안에서):
  #   docker exec infra-minio mc alias set local http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
  #   docker exec infra-minio mc mb -p local/<project>
  #   docker exec infra-minio mc admin user add local <key> <secret>
  #   docker exec infra-minio mc admin policy create local <project>-rw /tmp/<project>.json
  #   docker exec infra-minio mc admin policy attach local <project>-rw --user <key>
  minio:
    image: minio/minio:latest   # TODO: 버전 핀 고정 (cloudflared와 같은 숙제)
    container_name: infra-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER를 .env에 설정하세요}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD를 .env에 설정하세요}
      # prometheus가 인증 없이 스크랩할 수 있게 공개. 이 메트릭은 9000(S3 API)에 붙어 있고
      # 9000은 s3.rimsm.com으로 공개되므로, 터널 쪽에서 /minio/v2/metrics 경로를 404로 막았음
      # (cloudflared-minio/config.yml 참고). prometheus는 내부 네트워크로 직접 긁어서 영향 없음.
      MINIO_PROMETHEUS_AUTH_TYPE: public
      # 콘솔이 리버스 프록시 뒤에 있을 때 리다이렉트가 깨지지 않도록 공개 URL을 알려줌.
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 웹 콘솔
    volumes:
      - minio-data:/data
    networks:
      - home-server-network
    # 실측 유휴 290MB(2026-07-28). 업로드 피크 여유 포함해 512m.
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 공개 터널(계층② Cloudflare Tunnel) — 원래 여러 서비스가 터널 하나를 공유했으나(2026-07-20
  # infra로 이전 직후), Cloudflare 터널에 CLI rename이 없고 대시보드 이름 변경은 비가역
  # "마이그레이션"을 거쳐야 해서 라벨(대시보드에 "n8n"으로만 표시)이 혼란스러움 + n8n은
  # 동료도 쓰는 서비스라 신뢰 경계도 다름 → **서비스별로 터널을 완전히 분리**(같은 날 재결정).
  # → vault 01_Projects/99_RIMSM/099.home-server/overview.md 결정 히스토리 2026-07-20.
  #
  # 둘 다 prod 전용(profiles: prod) — stage 맥북엔 터널 자격증명이 없어서 그냥 up -d 하면 실패함.
  cloudflared-n8n:
    image: cloudflare/cloudflared:latest      # TODO: 버전 핀 고정 (n8n 때부터 미룬 것)
    container_name: cloudflared-n8n
    restart: unless-stopped
    profiles: ["prod"]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared-n8n/config.yml:/etc/cloudflared/config.yml:ro
      - ~/.cloudflared:/etc/cloudflared/creds:ro   # 터널 자격증명들(호스트에만 존재, repo에 없음). 컨테이너는 자기 config.yml이 가리키는 파일만 씀
    # 터널은 프록시라 리소스를 거의 안 씀. 실측 유휴: 약 34MB / CPU 0.7% (2026-07-17)
    mem_limit: 256m
    cpus: 0.5
    networks:
      - home-server-network

  cloudflared-rag:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-rag
    restart: unless-stopped
    profiles: ["prod"]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared-rag/config.yml:/etc/cloudflared/config.yml:ro
      - ~/.cloudflared:/etc/cloudflared/creds:ro
    mem_limit: 256m
    cpus: 0.5
    networks:
      - home-server-network

  # --- 모니터링 (2026-07-26 신설: Grafana로 인프라 전체 리소스 가시화) ---
  # 컨테이너별 CPU/RAM/네트워크는 cadvisor가 이 호스트의 모든 컨테이너를 자동 수집.
  # postgres/ollama/cloudflared 쪽엔 별도 설정 불필요.
  prometheus:
    image: prom/prometheus:latest
    container_name: infra-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - home-server-network
    mem_limit: 256m

  grafana:
    image: grafana/grafana:latest
    container_name: infra-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD를 .env에 설정하세요}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - home-server-network
    mem_limit: 256m

  # macOS Docker는 VM 위에서 돌아서 이 exporter가 보는 CPU/RAM은 실제 맥 하드웨어 전체가
  # 아니라 그 VM 내부 수치임(다른 서비스들과 동일한 제약). 컨테이너별 비교는 cadvisor가 더 정확.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: infra-node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks:
      - home-server-network
    mem_limit: 128m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: infra-cadvisor
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - home-server-network
    mem_limit: 128m

  # 공개 노출은 grafana만. prometheus/node-exporter/cadvisor는 home-server-network
  # 내부 전용(호스트 포트 미개방)이라 터널이 따로 필요 없음.
  cloudflared-grafana:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-grafana
    restart: unless-stopped
    profiles: ["prod"]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared-grafana/config.yml:/etc/cloudflared/config.yml:ro
      - ~/.cloudflared:/etc/cloudflared/creds:ro
    mem_limit: 256m
    cpus: 0.5
    networks:
      - home-server-network

  # MinIO는 S3 API(s3.rimsm.com)와 콘솔(minio.rimsm.com) 둘 다 공개 — 외부 서비스(n8n 워크플로우
  # 등)가 버킷에 직접 붙을 수 있게. 호스트네임 2개지만 터널은 하나로 묶음(같은 서비스라 신뢰
  # 경계가 동일 — n8n/rag를 나눈 이유와 다름).
  cloudflared-minio:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-minio
    restart: unless-stopped
    profiles: ["prod"]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared-minio/config.yml:/etc/cloudflared/config.yml:ro
      - ~/.cloudflared:/etc/cloudflared/creds:ro
    mem_limit: 256m
    cpus: 0.5
    networks:
      - home-server-network

volumes:
  pgdata:
  ollama:
  prometheus-data:
  grafana-data:
  minio-data:

networks:
  home-server-network:
    external: true   # docker network create home-server-network 로 미리 생성
