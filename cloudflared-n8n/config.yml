# Cloudflare Tunnel 설정 — n8n 전용.
#
# 2026-07-20 히스토리: 처음엔 이 터널(Cloudflare 쪽 이름이 "n8n")을 n8n+vault-rag가
# 공유했음 → 대시보드에 "rag.rimsm.com의 콘텐츠가 n8n"으로 표시돼 혼란 유발. Cloudflare
# 터널은 CLI에 rename 명령이 없고, 대시보드에서 이름 바꾸려면 "마이그레이션"(로컬 config.yml
# 관리 → 대시보드 관리 전환, **비가역**)을 거쳐야 해서 그건 포기하고 대신 **터널을 완전히
# 분리**함(2026-07-20). n8n은 동료도 쓸 수 있어 rag(개인 전용)와 신뢰 경계를 나누는 의미도 있음.
# → rag.rimsm.com은 별도 터널: ../cloudflared-rag/config.yml
#
# 터널 ID는 비밀 아님(공개돼도 무해). 진짜 비밀은 자격증명 JSON
# (~/.cloudflared/<UUID>.json) — 이 파일은 repo에 없고 컨테이너에 마운트만 함.

tunnel: 1af3804c-0c6b-4941-9112-55a2f5083346
credentials-file: /etc/cloudflared/creds/1af3804c-0c6b-4941-9112-55a2f5083346.json

# 엣지(Cloudflare)에서 TLS가 끝나므로 터널 안쪽은 평문 http로 충분.
# <서비스명>:<포트> = 같은 docker 네트워크(home-server-network) 안 서비스명 직결 (호스트 포트 안 거침).
ingress:
  - hostname: n8n.rimsm.com
    service: http://n8n:5678

  # 위에 안 걸리는 요청은 전부 404. (catch-all — 반드시 마지막)
  - service: http_status:404
